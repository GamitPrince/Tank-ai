; TEMPORARY ESP32-ONLY IMPLEMENTATION
; ====================================
; Nucleo-F767ZI is currently unavailable.
; This standalone PlatformIO project replaces the Nucleo functionality
; temporarily on the ESP32-S3 (KTRON ESP-S3-4G-DEV board).
;
; Revert to the original Nucleo + ESP32 architecture when the
; replacement Nucleo board becomes available.
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    vshymanskyy/TinyGSM@^0.11.7
    bblanchon/ArduinoJson@^7.0.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; TinyGSM modem selection — must match the modem on the KTRON board
    -DTINY_GSM_MODEM_SIM7600
    ; Mark this as the temporary ESP32-only build
    -DTEMP_ESP32_ONLY_MODE=1
