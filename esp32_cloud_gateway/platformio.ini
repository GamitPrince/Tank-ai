; PlatformIO Project Configuration
;
; ESP32 Cloud Gateway — receives sensor telemetry from STM32 Nucleo
; over UART and forwards to cloud via Wi-Fi or 4G LTE.
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    vshymanskyy/TinyGSM@^0.11.7
    bblanchon/ArduinoJson@^7.0.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; TinyGSM modem selection — change to match your modem chip
    ; Supported: TINY_GSM_MODEM_SIM7600, TINY_GSM_MODEM_A7670,
    ;            TINY_GSM_MODEM_SIM800, etc.
    -DTINY_GSM_MODEM_SIM7600
